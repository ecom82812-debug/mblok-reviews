name: Export reviews
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Force a full export
        default: '1'
permissions:
  contents: write
concurrency: export
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/export.py
        env:
          FULL: ${{ inputs.full }}
      - run: |
          git config user.name 'reviews-export'
          git config user.email 'reviews-export@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -m 'Update reviews' && git push; }
