name: Export reviews
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: export
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: npm install --no-save --no-audit --no-fund firebase@10.12.2
      - run: node scripts/fetch.mjs "$RUNNER_TEMP/reviews.json"
      - run: python3 scripts/export.py "$RUNNER_TEMP/reviews.json"
      - run: python3 scripts/warm.py
        continue-on-error: true
      - run: |
          git config user.name 'reviews-export'
          git config user.email 'reviews-export@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Update reviews'
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase -X theirs origin main
          done
          exit 1
